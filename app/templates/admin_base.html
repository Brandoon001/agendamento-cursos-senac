<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#004a8d">
    <meta name="description" content="Painel administrativo do SENAC Sobral.">
    <title>{% block title %}Painel administrativo | SENAC Cursos{% endblock %}</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.7.5/dist/css/tabler.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
  </head>
  <body class="admin-layout">
    <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>

    <div class="page">
      {% include "components/admin_shell.html" %}

      <div class="page-wrapper">
        <div class="container-xl pt-3">
          {% include "components/flash_messages.html" %}
        </div>

        <main id="conteudo-principal" class="page-body">
          <div class="container-xl">
            {% block content %}{% endblock %}
          </div>
        </main>

        <footer class="footer footer-transparent">
          <div class="container-xl">
            SENAC Sobral &middot; sistema de pré-inscrição em cursos gratuitos
          </div>
        </footer>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
