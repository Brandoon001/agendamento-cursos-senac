{% extends "base.html" %}

{% block title %}{{ titulo }} | SENAC Cursos{% endblock %}

{% block content %}
  <section class="error-page">
    <p class="error-code">{{ codigo }}</p>
    <h1>{{ titulo }}</h1>
    <p>{{ mensagem }}</p>
    <div class="form-actions justify-content-center">
      <a class="btn btn-primary" href="{{ url_for('main.index') }}">

      </a>
    </div>
  </section>
{% endblock %}
