<header class="site-header">
  <div class="container nav">
    <a class="brand" href="{{ url_for('main.index') }}">SENAC Cursos</a>

    <nav class="nav-links" aria-label="Navegação principal">
      <a href="{{ url_for('catalogo.listar') }}">Cursos</a>

      {% if current_user.is_authenticated %}
        <a href="{{ url_for('admin.dashboard') }}">Painel</a>
        <form method="post" action="{{ url_for('auth.logout') }}" class="inline-form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="link-button">Sair</button>
        </form>
      {% else %}
        <a href="{{ url_for('auth.login') }}">Entrar</a>
      {% endif %}
    </nav>
  </div>
</header>
